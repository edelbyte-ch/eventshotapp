# Build-script allowlist. allowBuilds is the pnpm 11 key; onlyBuiltDependencies
# is kept for pnpm 10 (this repo pins packageManager: pnpm@10.30.0), so the
# allowlist is honored regardless of which pnpm version corepack resolves.
allowBuilds:
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true
onlyBuiltDependencies:
  - '@prisma/engines'
  - prisma
  - sharp
# Security overrides for transitive deps pinned by prisma 7.10.0
# (GHSA-ggr8-5vv4-36mx, GHSA-3f6p-5ww8-9rcr, GHSA-rgwj-5xj2-c3m3).
overrides:
  deepmerge-ts@<8.0.0: 8.0.0
  mysql2@<3.23.1: 3.23.1
