name: Dependabot auto-merge
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - name: Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2

      - name: Checkout (PR merge result)
        uses: actions/checkout@v4

      - name: Docker build gate
        id: build
        run: |
          if [ -f Dockerfile ]; then
            echo "Root Dockerfile gefunden - baue Image zur Validierung des Updates..."
            docker build -t ci-validate:${GITHUB_SHA} .
          else
            echo "Kein root-Dockerfile - Build-Gate uebersprungen."
          fi

      - name: Auto-merge (Security patch & minor, Build bestanden)
        if: ${{ steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor' }}
        run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
